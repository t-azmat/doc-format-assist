services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: paper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-paper}
      POSTGRES_DB: paper_formatter
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper -d paper_formatter"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Not published by default: the API reaches it over the compose network,
    # and exposing Postgres on the host is how development databases end up on
    # the internet.
    expose:
      - "5432"

  # Migrations run as their own one-shot service rather than on API startup, so
  # two API replicas cannot race to apply the same migration.
  migrate:
    build: .
    command: ["npx", "tsx", "lib/db/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://paper:${POSTGRES_PASSWORD:-paper}@db:5432/paper_formatter
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      DATABASE_URL: postgres://paper:${POSTGRES_PASSWORD:-paper}@db:5432/paper_formatter
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      # Set these for a real deployment:
      #   CORS_ORIGINS  - the frontend's origin, if served from another host
      #   TRUST_PROXY   - number of proxy hops in front of this service
      #   OPENAI_API_KEY - enables the AI compliance check
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PYTHON_MAX_CONCURRENCY: ${PYTHON_MAX_CONCURRENCY:-1}
      PYTHON_TIMEOUT_MS: ${PYTHON_TIMEOUT_MS:-300000}
      PYTHON_QUEUE_TIMEOUT_MS: ${PYTHON_QUEUE_TIMEOUT_MS:-30000}
      PYTHON_MAX_QUEUE: ${PYTHON_MAX_QUEUE:-10}
      DOCLING_OCR: ${DOCLING_OCR:-0}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      # Manuscripts and the Docling model cache outlive the container.
      - storage:/var/lib/paper-formatter/storage
      - models:/var/lib/paper-formatter/models
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  db-data:
  storage:
  models:
