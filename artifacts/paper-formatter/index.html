    <!-- One font request. The stylesheet previously @imported Playfair + Inter
         while this file separately linked Inter, so the app fetched two
         overlapping families and blocked render on a CSS @import. IBM Plex Sans
         carries the interface, Plex Mono carries measurements, and no serif is
         loaded at all — the manuscript preview uses the typeface its StyleSpec
         asks for, which is a system face. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
