name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Typecheck first: it covers every workspace and fails fastest on the
      # kind of breakage a contract change causes.
      - run: npm test

      - run: npm run build

      - run: npm run test:smoke

      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

      # The generated client is committed, so a spec change that was not
      # followed by codegen would otherwise ship a client that disagrees with
      # the server.
      - name: Verify generated API client is up to date
        run: |
          npm run codegen -w @workspace/api-spec
          if [ -n "$(git status --porcelain -- lib/api-client-react lib/api-zod)" ]; then
            echo "::error::openapi.yaml changed without regenerating the client."
            echo "Run: npm run codegen -w @workspace/api-spec"
            git diff --stat -- lib/api-client-react lib/api-zod
            exit 1
          fi

  python:
    name: Formatting engine tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # The engine tests exercise styles/format/export only. Docling is a very
      # large dependency (it pulls a torch stack) and nothing under test
      # imports it, so installing python-docx alone keeps CI to a sane runtime.
      - run: pip install python-docx latex2mathml pytest uv

      - name: Verify Python lockfile matches project dependencies
        run: uv lock --check

      - run: python -m pytest artifacts/api-server/python/tests -q
      - run: python scripts/generate_editor_templates.py --check

  migrations:
    name: Migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paper_formatter_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Apply migrations to an empty database
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/paper_formatter_test
        run: npm run migrate

      - name: Verify version recovery and document ownership
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/paper_formatter_test
        run: npm run test -w @workspace/api-server -- src/routes/versions.integration.test.ts

      # A schema change without a matching migration is the failure mode that
      # `drizzle-kit push` used to hide: generate again and expect no new file.
      - name: Verify no migration is missing
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/paper_formatter_test
        run: |
          npm run generate -w @workspace/db
          if [ -n "$(git status --porcelain -- lib/db/migrations)" ]; then
            echo "::error::Schema changed without a generated migration."
            echo "Run: npm run generate -w @workspace/db"
            git status --short -- lib/db/migrations
            exit 1
          fi
